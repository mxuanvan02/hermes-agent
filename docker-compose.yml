#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns the Hermes config
# directory so files created inside the container stay readable/writable on
# the host. The s6-overlay stage2 hook remaps the internal `hermes` user to
# these values via usermod/groupmod; each supervised service then drops to
# that user via `s6-setuidgid`.
#
# Host path overrides (defaults are tuned for a checkout living next to its
# config/workspace siblings, but every path is overridable via env vars):
#
#   HERMES_CONFIG_DIR    Host dir mounted as /opt/data (Hermes home).
#                        Default: ./config  (sibling of this repo)
#   HERMES_ENV_FILE      env_file path passed to the container.
#                        Default: ./config/.env
#   OPENCLAW_WORKSPACE   Host workspace root mounted under
#                        /home/node/.openclaw/workspace.
#                        Default: ./workspace
#   HOST_WORKSPACE       Host "working" dir mounted at
#                        /home/node/.openclaw/workspace/working and
#                        /workspace/working. Default: ./workspace/working
#   OPENCLAW_TOOLS_DIR   Host dir whose bin/ holds latexmk, pdflatex, conda,
#                        etc. Default: ./workspace/tools
#   FFF_MCP_DIR          Host dir for the fff-mcp tool mount.
#                        Default: ./workspace/tools/fff-mcp
#   HOST_GEMINI_DIR      Host ~/.gemini mounted read-only.
#                        Default: ${HOME}/.gemini
#   CDP_HOST_IP          Host IP for the Chrome CDP bridge (browser tooling).
#                        Default: 127.0.0.1
#   HERMES_UID / HERMES_GID  Host user/group owning the config dir.
#                        Defaults: 1000 / 1000
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  gateway:
    build: .
    image: hermes-agent:local-main
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${HERMES_ENV_FILE:-./config/.env}
    volumes:
      - ${HERMES_CONFIG_DIR:-./config}:/opt/data
      - ${OPENCLAW_WORKSPACE:-./workspace}:/home/node/.openclaw/workspace
      - ${HOST_WORKSPACE:-./workspace/working}:/home/node/.openclaw/workspace/working
      - ${FFF_MCP_DIR:-./workspace/tools/fff-mcp}:/tmp/openclaw-tools/fff-mcp
      - ${HOST_WORKSPACE:-./workspace/working}:/workspace/working
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/latexmk:/usr/local/bin/latexmk:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/pdflatex:/usr/local/bin/pdflatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/xelatex:/usr/local/bin/xelatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/lualatex:/usr/local/bin/lualatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/bibtex:/usr/local/bin/bibtex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/biber:/usr/local/bin/biber:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/conda/bin/conda:/usr/local/bin/conda:ro
      - ./hermes_constants.py:/opt/hermes/hermes_constants.py:ro
      - ./cli.py:/opt/hermes/cli.py:ro
      - ./locales:/opt/hermes/locales:ro
      - ./run_agent.py:/opt/hermes/run_agent.py:ro
      - ./agent/agent_init.py:/opt/hermes/agent/agent_init.py:ro
      - ./agent/context_budgeter.py:/opt/hermes/agent/context_budgeter.py:ro
      - ./agent/conversation_loop.py:/opt/hermes/agent/conversation_loop.py:ro
      - ./tools/vision_tools.py:/opt/hermes/tools/vision_tools.py:ro
      - ./tools/send_message_tool.py:/opt/hermes/tools/send_message_tool.py:ro
      - ./gateway/platforms/base.py:/opt/hermes/gateway/platforms/base.py:ro
      - ./gateway/platforms/telegram.py:/opt/hermes/gateway/platforms/telegram.py:ro
      - ./plugins/web/ninerouter:/opt/hermes/plugins/web/ninerouter:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_GEMINI_DIR:-${HOME}/.gemini}:/opt/data/.gemini:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      - HERMES_HOME=/opt/data
      - HOME=/opt/data
      - XDG_STATE_HOME=/opt/data/state
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_KANBAN_DISPATCH_IN_GATEWAY=0
      - HERMES_API_TIMEOUT=1200
      - HERMES_API_CALL_STALE_TIMEOUT=360
      - HERMES_STREAM_READ_TIMEOUT=360
      - HERMES_STREAM_STALE_TIMEOUT=360
      - HERMES_STREAM_MAX_DURATION=1200
      - HERMES_STREAM_RETRIES=5
      # v0.15+ redirects `gateway run` to s6 profile supervision by default.
      # This compose deployment already owns the foreground gateway process, so
      # opt out and keep the existing local config/profile layout unchanged.
      - HERMES_GATEWAY_NO_SUPERVISE=1
      # The compose command below already runs the single canonical gateway.
      # Keep /init bootstrap, but prevent s6 profile reconciliation from
      # auto-starting a second gateway-default process on Colima/container restarts.
      - S6_PROFILE_GATEWAY_SCANDIR=/tmp/hermes-compose-services
      - TMPDIR=/opt/data/tmp
      # Host Chrome CDP bridge for browser tooling. Start Chrome on the host
      # with --remote-debugging-port=9222 before using this from the container.
      # In this Colima setup host.docker.internal resolves, but Chrome rejects
      # that Host header; use the resolved host-gateway IP instead.
      - BU_CDP_URL=http://${CDP_HOST_IP:-127.0.0.1}:9222
      - BROWSER_CDP_URL=http://${CDP_HOST_IP:-127.0.0.1}:9222
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command:
      - env
      - PATH=/command:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - /command/with-contenv
      - /opt/hermes/.venv/bin/hermes
      - gateway
      - run

  dashboard:
    image: hermes-agent:local-main
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    env_file:
      - ${HERMES_ENV_FILE:-./config/.env}
    volumes:
      - ${HERMES_CONFIG_DIR:-./config}:/opt/data
      - ${OPENCLAW_WORKSPACE:-./workspace}:/home/node/.openclaw/workspace
      - ${HOST_WORKSPACE:-./workspace/working}:/home/node/.openclaw/workspace/working
      - ${FFF_MCP_DIR:-./workspace/tools/fff-mcp}:/tmp/openclaw-tools/fff-mcp
      - ${HOST_WORKSPACE:-./workspace/working}:/workspace/working
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/latexmk:/usr/local/bin/latexmk:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/pdflatex:/usr/local/bin/pdflatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/xelatex:/usr/local/bin/xelatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/lualatex:/usr/local/bin/lualatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/bibtex:/usr/local/bin/bibtex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/biber:/usr/local/bin/biber:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/conda/bin/conda:/usr/local/bin/conda:ro
      - ./hermes_constants.py:/opt/hermes/hermes_constants.py:ro
      - ./cli.py:/opt/hermes/cli.py:ro
      - ./locales:/opt/hermes/locales:ro
      - ./run_agent.py:/opt/hermes/run_agent.py:ro
      - ./agent/agent_init.py:/opt/hermes/agent/agent_init.py:ro
      - ./agent/context_budgeter.py:/opt/hermes/agent/context_budgeter.py:ro
      - ./agent/conversation_loop.py:/opt/hermes/agent/conversation_loop.py:ro
      - ./tools/send_message_tool.py:/opt/hermes/tools/send_message_tool.py:ro
      - ./gateway/platforms/base.py:/opt/hermes/gateway/platforms/base.py:ro
      - ./gateway/platforms/telegram.py:/opt/hermes/gateway/platforms/telegram.py:ro
      - ./plugins/web/ninerouter:/opt/hermes/plugins/web/ninerouter:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_GEMINI_DIR:-${HOME}/.gemini}:/opt/data/.gemini:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      - HERMES_HOME=/opt/data
      - HOME=/opt/data
      - XDG_STATE_HOME=/opt/data/state
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      # Keep /init bootstrap, but do not let this sidecar register
      # profile gateway services into /run/service. Only the gateway
      # container should own /opt/data/logs/gateways/* locks.
      - S6_PROFILE_GATEWAY_SCANDIR=/tmp/hermes-sidecar-services
      - TMPDIR=/opt/data/tmp
    # Localhost-only. OpenClaw uses 18789/18790; Hermes dashboard uses 19119.
    command:
      - env
      - PATH=/command:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - /command/with-contenv
      - /opt/hermes/.venv/bin/hermes
      - dashboard
      - --host
      - 127.0.0.1
      - --port
      - "19119"
      - --no-open

  handoff-watcher:
    image: hermes-agent:local-main
    container_name: hermes-handoff-watcher
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    env_file:
      - ${HERMES_ENV_FILE:-./config/.env}
    volumes:
      - ${HERMES_CONFIG_DIR:-./config}:/opt/data
      - ${OPENCLAW_WORKSPACE:-./workspace}:/home/node/.openclaw/workspace
      - ${HOST_WORKSPACE:-./workspace/working}:/home/node/.openclaw/workspace/working
      - ${FFF_MCP_DIR:-./workspace/tools/fff-mcp}:/tmp/openclaw-tools/fff-mcp
      - ${HOST_WORKSPACE:-./workspace/working}:/workspace/working
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/latexmk:/usr/local/bin/latexmk:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/pdflatex:/usr/local/bin/pdflatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/xelatex:/usr/local/bin/xelatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/lualatex:/usr/local/bin/lualatex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/bibtex:/usr/local/bin/bibtex:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/latex/bin/biber:/usr/local/bin/biber:ro
      - ${OPENCLAW_TOOLS_DIR:-./workspace/tools}/conda/bin/conda:/usr/local/bin/conda:ro
      - ./hermes_constants.py:/opt/hermes/hermes_constants.py:ro
      - ./cli.py:/opt/hermes/cli.py:ro
      - ./locales:/opt/hermes/locales:ro
      - ./run_agent.py:/opt/hermes/run_agent.py:ro
      - ./agent/agent_init.py:/opt/hermes/agent/agent_init.py:ro
      - ./agent/context_budgeter.py:/opt/hermes/agent/context_budgeter.py:ro
      - ./agent/conversation_loop.py:/opt/hermes/agent/conversation_loop.py:ro
      - ./tools/send_message_tool.py:/opt/hermes/tools/send_message_tool.py:ro
      - ./gateway/platforms/base.py:/opt/hermes/gateway/platforms/base.py:ro
      - ./gateway/platforms/telegram.py:/opt/hermes/gateway/platforms/telegram.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_GEMINI_DIR:-${HOME}/.gemini}:/opt/data/.gemini:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      - HERMES_HOME=/opt/data
      - HOME=/opt/data
      - XDG_STATE_HOME=/opt/data/state
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_KANBAN_DISPATCH_IN_GATEWAY=0
      # Keep /init bootstrap, but do not let this sidecar register
      # profile gateway services into /run/service. Only the gateway
      # container should own /opt/data/logs/gateways/* locks.
      - S6_PROFILE_GATEWAY_SCANDIR=/tmp/hermes-sidecar-services
      - TMPDIR=/opt/data/tmp
    command:
      - env
      - PATH=/command:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - /command/with-contenv
      - /opt/hermes/.venv/bin/python
      - /home/node/.openclaw/workspace/tools/agent_collaboration/hermes_handoff_watcher.py
      - --interval
      - "15"
